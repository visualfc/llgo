name: Setup GDB
# Keep the debugger's rolling MSYS2 dependencies isolated from the pinned
# compiler/LLDB installation. Only the absolute executable path is exported.
description: Install Python-enabled multiarch GDB without changing the compiler toolchain
outputs:
  path:
    description: Absolute path to the Python-enabled GDB executable
    value: ${{ steps.windows.outputs.path || steps.unix.outputs.path }}
runs:
  using: composite
  steps:
    - name: Install Linux GDB
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y gdb-multiarch

    - name: Install macOS GDB
      if: runner.os == 'macOS'
      shell: bash
      env:
        # Intel runners retain bottled versions from their image; refreshing
        # metadata can force a source build on this Homebrew Tier 3 host.
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_UPGRADE: "1"
      run: brew list --versions gdb || brew install gdb

    - name: Export Unix GDB
      if: runner.os != 'Windows'
      id: unix
      shell: bash
      run: |
        set -euo pipefail
        gdb_path="$(command -v gdb-multiarch || command -v gdb)"
        "$gdb_path" --version
        "$gdb_path" --batch --nx -ex 'python import json; print("GDB Python ready")'
        echo "path=$gdb_path" >> "$GITHUB_OUTPUT"
        echo "LLGO_GDB=$gdb_path" >> "$GITHUB_ENV"

    - name: Install isolated Windows GDB environment
      if: runner.os == 'Windows'
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        location: ${{ runner.temp }}/llgo-gdb-msys2
        msystem: ${{ runner.arch == 'ARM64' && 'CLANGARM64' || 'CLANG64' }}
        path-type: minimal
        update: true
        install: ${{ runner.arch == 'ARM64' && 'mingw-w64-clang-aarch64-gdb-multiarch' || 'mingw-w64-clang-x86_64-gdb-multiarch' }}

    - name: Export Windows GDB
      if: runner.os == 'Windows'
      id: windows
      shell: pwsh
      env:
        GDB_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        $ErrorActionPreference = "Stop"
        $subdir = if ("${{ runner.arch }}" -eq "ARM64") { "clangarm64" } else { "clang64" }
        $gdb = Join-Path $env:GDB_MSYS2_ROOT "$subdir/bin/gdb-multiarch.exe"
        # Python belongs to this GDB installation, not the LLVM LLDB runtime.
        Remove-Item Env:PYTHONHOME, Env:PYTHONPATH -ErrorAction SilentlyContinue
        & $gdb --version
        if ($LASTEXITCODE -ne 0) { throw "GDB version probe failed: $LASTEXITCODE" }
        & $gdb --batch --nx -ex 'python import json; print("GDB Python ready")'
        if ($LASTEXITCODE -ne 0) { throw "GDB Python probe failed: $LASTEXITCODE" }
        "path=$gdb" >> $env:GITHUB_OUTPUT
        "LLGO_GDB=$gdb" >> $env:GITHUB_ENV
