name: "Setup Demo Dependencies"
description: "Install dependencies required by the LLGo demo suite"
inputs:
  windows-abi:
    description: "Native Windows toolchain profile: msvc or mingw"
    required: false
    default: "msvc"

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.12 on Windows
      if: runner.os == 'Windows'
      id: windows_python
      uses: actions/setup-python@v6
      with:
        # LLVM 19.1.3's MSVC LLDB embeds the 3.12.7 hosted-tool-cache prefix.
        # A newer 3.12 patch is ABI-compatible, but LLDB combines its embedded
        # stdlib path with that installation and cannot import encodings. Keep
        # the MinGW demo environment on the normal latest 3.12 patch.
        python-version: ${{ inputs.windows-abi == 'msvc' && '3.12.7' || '3.12' }}
        # setup-python otherwise replaces PKG_CONFIG_PATH, hiding the native
        # vcpkg metadata installed by setup-deps from LLGo's runtime build.
        update-environment: false

    - name: Install cargs demo library on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        case "${RUNNER_OS}" in
          Linux)
            demo_pkg="cargs_linux_amd64.zip"
            ;;
          macOS)
            case "$(uname -m)" in
              x86_64)
                demo_pkg="cargs_darwin_amd64.zip"
                ;;
              arm64)
                demo_pkg="cargs_darwin_arm64.zip"
                ;;
              *)
                echo "Unsupported macOS architecture: $(uname -m)" >&2
                exit 1
                ;;
            esac
            ;;
        esac

        libs_dir="${GITHUB_WORKSPACE}/_demo/c/cargs/libs"
        mkdir -p "${libs_dir}"
        wget -P "${libs_dir}" "https://github.com/xgo-dev/llpkg/releases/download/cargs/v1.0.0/${demo_pkg}"
        unzip -o "${libs_dir}/${demo_pkg}" -d "${libs_dir}"

        for tmpl in "${libs_dir}"/lib/pkgconfig/*.pc.tmpl; do
          pc_file="${tmpl%.tmpl}"
          sed "s|{{.Prefix}}|${libs_dir}|g" "${tmpl}" > "${pc_file}"
        done

        echo "PKG_CONFIG_PATH=${libs_dir}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"

    - name: Build cargs demo library on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        # Pin the target of the upstream v1.2.0 annotated tag so source
        # downloads cannot change if that tag is moved.
        CARGS_COMMIT: 0fbac1a0c6ebb7ecd72f0d7ae89c2b79eb3a12eb
      run: |
        $ErrorActionPreference = "Stop"

        if ("${{ inputs.windows-abi }}" -notin @("msvc", "mingw")) {
          throw "Unsupported Windows ABI profile: ${{ inputs.windows-abi }}"
        }
        $compiler = (Get-Command clang.exe).Source
        $target = (& $compiler -dumpmachine).Trim()
        if ("${{ inputs.windows-abi }}" -eq "msvc") {
          if ($target -notmatch "-windows-msvc$") {
            throw "The MSVC profile resolved Clang target $target"
          }
          $runtimeArgs = @("-fms-runtime-lib=dll")
          $archive = "cargs.lib"
        } else {
          if ($target -notmatch "-(windows-gnu|mingw32)$") {
            throw "The MinGW profile resolved Clang target $target"
          }
          $runtimeArgs = @()
          $archive = "libcargs.a"
        }

        $libsDir = Join-Path $env:GITHUB_WORKSPACE "_demo\c\cargs\libs"
        $includeDir = Join-Path $libsDir "include"
        $libDir = Join-Path $libsDir "lib"
        $pcDir = Join-Path $env:RUNNER_TEMP "llgo-pkgconfig"
        New-Item -ItemType Directory -Force $includeDir, $libDir, $pcDir | Out-Null

        $source = Join-Path $env:RUNNER_TEMP "cargs.c"
        $baseUrl = "https://raw.githubusercontent.com/likle/cargs/$env:CARGS_COMMIT"
        Invoke-WebRequest "$baseUrl/include/cargs.h" -OutFile (Join-Path $includeDir "cargs.h")
        Invoke-WebRequest "$baseUrl/src/cargs.c" -OutFile $source

        $object = Join-Path $env:RUNNER_TEMP "cargs.obj"
        & $compiler @runtimeArgs -O2 -std=c11 `
          "-I$includeDir" -c $source -o $object
        if ($LASTEXITCODE -ne 0) {
          throw "Compiling cargs failed with exit code $LASTEXITCODE"
        }
        if ("${{ inputs.windows-abi }}" -eq "msvc") {
          & llvm-lib "/out:$(Join-Path $libDir $archive)" $object
        } else {
          & llvm-ar rcs (Join-Path $libDir $archive) $object
        }
        if ($LASTEXITCODE -ne 0) {
          throw "Archiving cargs failed with exit code $LASTEXITCODE"
        }

        # A static target-native library avoids a demo-only DLL search path.
        # Each profile's pkg-config resolves -lcargs to its own archive format.
        # Windows pkgconf relocates a variable named "prefix" relative to the
        # .pc file by default. Keep these installation paths absolute because
        # the metadata intentionally lives under RUNNER_TEMP, not the library.
        $pcIncludeDir = $includeDir.Replace('\', '/')
        $pcLibDir = $libDir.Replace('\', '/')
        @"
        libdir=$pcLibDir
        includedir=$pcIncludeDir

        Name: cargs
        Description: A simple argument parser library
        Version: 1.2.0
        Libs: -L"`${libdir}" -lcargs
        Cflags: -I"`${includedir}"
        "@ | Set-Content -Encoding ascii (Join-Path $pcDir "cargs.pc")

    - name: Install Python demo dependencies on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        pip3.12 install --break-system-packages numpy torch

        pcdir="${HOME}/pc"
        mkdir -p "${pcdir}"
        libdir="$(pkg-config --variable=libdir python-3.12-embed)"
        ln -sf "${libdir}/pkgconfig/python-3.12-embed.pc" "${pcdir}/python3-embed.pc"

        echo "PKG_CONFIG_PATH=${pcdir}:${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"
        echo "LLGO_FULL_RPATH=true" >> "${GITHUB_ENV}"

    - name: Install Python demo dependencies on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $python = "${{ steps.windows_python.outputs.python-path }}"
        & $python -m pip install numpy torch
        if ($LASTEXITCODE -ne 0) {
          throw "Installing Python demo dependencies failed with exit code $LASTEXITCODE"
        }

        $prefix = (& $python -c "import sys; print(sys.base_prefix)").Trim()
        $includeDir = (& $python -c "import sysconfig; print(sysconfig.get_path('include'))").Trim()
        $version = (& $python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')").Trim()
        $libDir = Join-Path $prefix "libs"
        $importLibrary = Join-Path $libDir "python$version.lib"
        if (-not (Test-Path $importLibrary)) {
          throw "Python import library was not found at $importLibrary"
        }
        if ("${{ inputs.windows-abi }}" -eq "mingw") {
          # LLVM's MinGW linker accepts the same COFF import-library contents
          # but its -l search uses the GNU filename. Keep the official Python
          # artifact untouched and expose only a profile-local spelling.
          Copy-Item -Force $importLibrary (Join-Path $libDir "libpython$version.a")
        }

        $pcDir = Join-Path $env:RUNNER_TEMP "llgo-pkgconfig"
        New-Item -ItemType Directory -Force $pcDir | Out-Null
        $pcIncludeDir = $includeDir.Replace('\', '/')
        $pcLibDir = $libDir.Replace('\', '/')
        @"
        libdir=$pcLibDir
        includedir=$pcIncludeDir

        Name: Python
        Description: Python library for LLGo embedding demos
        Version: 3.12
        Libs: -L"`${libdir}" -lpython$version
        Cflags: -I"`${includedir}"
        "@ | Set-Content -Encoding ascii (Join-Path $pcDir "python3-embed.pc")

        Add-Content -Encoding utf8 $env:GITHUB_PATH $prefix
        Add-Content -Encoding utf8 $env:GITHUB_ENV "LLGO_WINDOWS_PYTHON_HOME=$prefix"
