name: "Setup Go"
description: "Set up and verify the requested Go toolchain"
inputs:
  go-version:
    description: "The exact Go version to install; omit it for the LLGo build toolchain"
    required: false
    default: ""
  architecture:
    description: "Host Go architecture; defaults to the runner architecture"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Configure Go environment
      shell: bash
      run: |
        echo "GOPATH=${RUNNER_TEMP}/go" >> "$GITHUB_ENV"
        echo "GOBIN=${RUNNER_TEMP}/go/bin" >> "$GITHUB_ENV"
        echo "GOMODCACHE=${RUNNER_TEMP}/go/pkg/mod" >> "$GITHUB_ENV"
        echo "GOCACHE=${RUNNER_TEMP}/go-build-cache" >> "$GITHUB_ENV"

    - name: Select Go archive extractor on Windows
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      id: windows_archive_path
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $overrides = @{}
        # Match setup-demo-deps' archive policy. PowerShell 7 can abort inside
        # ZipFile.ExtractToDirectory before tool-cache's catch/fallback runs.
        # Hide it only from setup-go. Use the runner architecture above: the
        # installed Go may be x64. If pwsh is absent, tool-cache already uses
        # Windows PowerShell, so no PATH override is needed.
        $pwsh = Get-Command pwsh.exe -ErrorAction SilentlyContinue
        if ($pwsh) {
          $pwshDir = (Split-Path -Parent $pwsh.Source).TrimEnd('\')
          $path = (($env:PATH -split ';') | Where-Object {
            $_ -and $_.Trim().Trim('"').TrimEnd('\') -ine $pwshDir
          }) -join ';'
          if ($path -eq $env:PATH) {
            throw "Failed to remove PowerShell 7 from setup-go's PATH"
          }
          $overrides.PATH = $path
        }
        $json = ConvertTo-Json -InputObject $overrides -Compress
        "env=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Set up the LLGo build toolchain
      if: inputs.go-version == ''
      uses: actions/setup-go@v7
      env: ${{ fromJSON(steps.windows_archive_path.outputs.env || '{}') }}
      with:
        go-version-file: .go-version
        architecture: ${{ inputs.architecture }}
        cache: true
        cache-dependency-path: |
          **/go.sum

    - name: Set up an explicit Go toolchain
      if: inputs.go-version != ''
      uses: actions/setup-go@v7
      env: ${{ fromJSON(steps.windows_archive_path.outputs.env || '{}') }}
      with:
        go-version: ${{ inputs.go-version }}
        architecture: ${{ inputs.architecture }}
        cache: true
        cache-dependency-path: |
          **/go.sum

    - name: Verify Go installation
      shell: bash
      run: |
        set -euo pipefail

        requested="${{ inputs.go-version }}"
        if [[ -z "${requested}" ]]; then
          requested="$(tr -d '[:space:]' < .go-version)"
        fi
        requested="${requested#go}"
        actual="$(go env GOVERSION)"
        actual="${actual#go}"

        if [[ ! "$requested" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Go version must be an exact stable release, got ${requested}" >&2
          exit 1
        fi
        if [[ "$actual" != "$requested" ]]; then
          echo "Expected Go ${requested}, got go${actual}" >&2
          exit 1
        fi

        requested_arch="${{ inputs.architecture }}"
        case "$requested_arch" in
          "") ;;
          x64) requested_arch=amd64 ;;
          x86) requested_arch=386 ;;
        esac
        if [[ -n "$requested_arch" && "$(go env GOHOSTARCH)" != "$requested_arch" ]]; then
          echo "Expected Go host architecture ${requested_arch}, got $(go env GOHOSTARCH)" >&2
          exit 1
        fi

        echo "Requested Go: ${requested}"
        echo "Resolved Go: go${actual}"
        echo "Resolved host architecture: $(go env GOHOSTARCH)"
        echo "Go binary: $(command -v go)"
        go version
        go env GOROOT
