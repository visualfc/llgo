name: Publish baseline benchmarks

on:
  workflow_run:
    workflows: [Baseline benchmarks]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BENCHMARKS_REPOSITORY: >-
        ${{ vars.BENCHMARKS_REPOSITORY ||
            format('{0}/llgo-benchmark-data', github.repository_owner) }}
      BENCHMARKS_TOKEN: ${{ secrets.BENCHMARKS_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Download Linux benchmark artifact
        uses: actions/download-artifact@v8
        with:
          name: llgo-baseline-benchmark-linux
          path: .benchmark/results/linux
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download macOS benchmark artifact
        uses: actions/download-artifact@v8
        with:
          name: llgo-baseline-benchmark-macos
          path: .benchmark/results/macos
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Select benchmark series
        id: series
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid benchmark commit: ${HEAD_SHA:-missing}" >&2
            exit 1
          fi
          if [[ ! "$BENCHMARKS_REPOSITORY" =~ ^${GITHUB_REPOSITORY_OWNER}/[A-Za-z0-9._-]+$ ]]; then
            echo "benchmark repository must belong to ${GITHUB_REPOSITORY_OWNER}" >&2
            exit 1
          fi

          kind=
          id=
          label=
          relative=
          case "$RUN_EVENT" in
            pull_request)
              if [[ -z "$PR_NUMBER" ]]; then
                PR_NUMBER="$(
                  gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
                    --jq '[.[] | select(.state == "open")][0].number // empty'
                )"
              fi
              if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
                echo "cannot resolve pull request for ${HEAD_SHA}" >&2
                exit 1
              fi
              kind=pull
              id="$PR_NUMBER"
              label="PR #${PR_NUMBER}"
              relative="pulls/${PR_NUMBER}"
              ;;
            push|workflow_dispatch)
              if [[ -z "$HEAD_BRANCH" ]]; then
                echo "missing branch for ${RUN_EVENT}" >&2
                exit 1
              fi
              if [[ "$HEAD_BRANCH" == main ]]; then
                kind=main
                id=main
                label=main
                relative=main
              else
                prefix="$(
                  printf '%s' "$HEAD_BRANCH" \
                    | tr '[:upper:]' '[:lower:]' \
                    | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//' \
                    | cut -c1-48
                )"
                digest="$(printf '%s' "$HEAD_BRANCH" | sha256sum | cut -c1-12)"
                kind=branch
                id="${prefix:-branch}-${digest}"
                label="$HEAD_BRANCH"
                relative="branches/${id}"
              fi
              ;;
            *)
              echo "unsupported source event: ${RUN_EVENT}" >&2
              exit 1
              ;;
          esac

          {
            data_name="${BENCHMARKS_REPOSITORY#*/}"
            echo "kind=$kind"
            echo "id=$id"
            echo "label=$label"
            echo "relative=$relative"
            echo "path=llgo/baseline/$relative"
            echo "series_url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${data_name}/llgo/baseline/?series=${relative}"
            echo "sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Validate untrusted benchmark artifact
        run: |
          go run ./benchmark/baseline -mode validate -out .benchmark/results/linux
          go run ./benchmark/baseline -mode validate -out .benchmark/results/macos

      - name: Require benchmark repository token
        run: |
          if [[ -z "$BENCHMARKS_TOKEN" ]]; then
            echo "BENCHMARKS_DISPATCH_TOKEN is not configured" >&2
            exit 1
          fi

      - name: Bootstrap benchmark data branch
        run: |
          set -euo pipefail
          remote="https://x-access-token:${BENCHMARKS_TOKEN}@github.com/${BENCHMARKS_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" pages >/dev/null 2>&1; then
            exit 0
          fi

          bootstrap=".benchmark/pages-bootstrap"
          mkdir -p "$bootstrap/llgo/baseline/main"
          git init --initial-branch=pages "$bootstrap"
          git -C "$bootstrap" config user.name "github-actions[bot]"
          git -C "$bootstrap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch "$bootstrap/.nojekyll"
          printf '%s\n' \
            'window.BENCHMARK_DATA = {"lastUpdate":0,"repoUrl":"","entries":{}}' \
            > "$bootstrap/llgo/baseline/main/data.js"
          printf '%s\n' \
            '{"schemaVersion":1,"series":[]}' \
            > "$bootstrap/llgo/baseline/series.json"
          git -C "$bootstrap" add .nojekyll llgo/baseline/main/data.js llgo/baseline/series.json
          git -C "$bootstrap" commit -m "ci: initialize benchmark history"
          if ! git -C "$bootstrap" push "$remote" HEAD:pages; then
            git ls-remote --exit-code --heads "$remote" pages >/dev/null
          fi

      # v1.22.1.
      - name: Publish Linux program sizes
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: Linux program binary size
          tool: customSmallerIsBetter
          output-file-path: .benchmark/results/linux/size.json
          gh-pages-branch: pages
          gh-repository: github.com/${{ env.BENCHMARKS_REPOSITORY }}
          benchmark-data-dir-path: ${{ steps.series.outputs.path }}
          github-token: ${{ env.BENCHMARKS_TOKEN }}
          ref: ${{ steps.series.outputs.sha }}
          auto-push: true

      - name: Reset benchmark data checkout
        run: rm -rf benchmark-data-repository

      - name: Publish Linux program timings
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: Linux program build and run time
          tool: customSmallerIsBetter
          output-file-path: .benchmark/results/linux/time.json
          gh-pages-branch: pages
          gh-repository: github.com/${{ env.BENCHMARKS_REPOSITORY }}
          benchmark-data-dir-path: ${{ steps.series.outputs.path }}
          github-token: ${{ env.BENCHMARKS_TOKEN }}
          ref: ${{ steps.series.outputs.sha }}
          auto-push: true

      - name: Reset benchmark data checkout
        run: rm -rf benchmark-data-repository

      - name: Publish Linux core benchmarks
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: Linux compiler and core language
          tool: go
          output-file-path: .benchmark/results/linux/go.txt
          gh-pages-branch: pages
          gh-repository: github.com/${{ env.BENCHMARKS_REPOSITORY }}
          benchmark-data-dir-path: ${{ steps.series.outputs.path }}
          github-token: ${{ env.BENCHMARKS_TOKEN }}
          ref: ${{ steps.series.outputs.sha }}
          auto-push: true

      - name: Reset benchmark data checkout
        run: rm -rf benchmark-data-repository

      - name: Publish macOS program sizes
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: macOS program binary size
          tool: customSmallerIsBetter
          output-file-path: .benchmark/results/macos/size.json
          gh-pages-branch: pages
          gh-repository: github.com/${{ env.BENCHMARKS_REPOSITORY }}
          benchmark-data-dir-path: ${{ steps.series.outputs.path }}
          github-token: ${{ env.BENCHMARKS_TOKEN }}
          ref: ${{ steps.series.outputs.sha }}
          auto-push: true

      - name: Reset benchmark data checkout
        run: rm -rf benchmark-data-repository

      - name: Publish macOS program timings
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: macOS program build and run time
          tool: customSmallerIsBetter
          output-file-path: .benchmark/results/macos/time.json
          gh-pages-branch: pages
          gh-repository: github.com/${{ env.BENCHMARKS_REPOSITORY }}
          benchmark-data-dir-path: ${{ steps.series.outputs.path }}
          github-token: ${{ env.BENCHMARKS_TOKEN }}
          ref: ${{ steps.series.outputs.sha }}
          auto-push: true

      - name: Reset benchmark data checkout
        run: rm -rf benchmark-data-repository

      - name: Publish macOS core benchmarks
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: macOS compiler and core language
          tool: go
          output-file-path: .benchmark/results/macos/go.txt
          gh-pages-branch: pages
          gh-repository: github.com/${{ env.BENCHMARKS_REPOSITORY }}
          benchmark-data-dir-path: ${{ steps.series.outputs.path }}
          github-token: ${{ env.BENCHMARKS_TOKEN }}
          ref: ${{ steps.series.outputs.sha }}
          auto-push: true

      - name: Remove benchmark data checkout
        run: rm -rf benchmark-data-repository

      - name: Update benchmark series index
        env:
          SERIES_KIND: ${{ steps.series.outputs.kind }}
          SERIES_ID: ${{ steps.series.outputs.id }}
          SERIES_LABEL: ${{ steps.series.outputs.label }}
          SERIES_RELATIVE: ${{ steps.series.outputs.relative }}
          SOURCE_SHA: ${{ steps.series.outputs.sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}/commit/${{ steps.series.outputs.sha }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${BENCHMARKS_TOKEN}@github.com/${BENCHMARKS_REPOSITORY}.git"
          updated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          entry="$(
            jq -cn \
              --arg kind "$SERIES_KIND" \
              --arg id "$SERIES_ID" \
              --arg label "$SERIES_LABEL" \
              --arg path "${SERIES_RELATIVE}/" \
              --arg sha "$SOURCE_SHA" \
              --arg sourceUrl "$SOURCE_URL" \
              --arg updatedAt "$updated_at" \
              '{kind:$kind,id:$id,label:$label,path:$path,sha:$sha,sourceUrl:$sourceUrl,updatedAt:$updatedAt}'
          )"

          for attempt in 1 2 3 4 5; do
            rm -rf .benchmark/pages
            git clone --depth=1 --branch pages "$remote" .benchmark/pages
            index_dir=".benchmark/pages/llgo/baseline"
            mkdir -p "$index_dir"
            if [[ -s "$index_dir/series.json" ]]; then
              jq --argjson entry "$entry" '
                .schemaVersion = 1
                | .series = (
                    [.series[] | select(.kind != $entry.kind or .id != $entry.id)] + [$entry]
                    | sort_by(
                        if .kind == "main" then [0, 0]
                        elif .kind == "branch" then [1, .label]
                        else [2, -(.id | tonumber)] end
                      )
                  )
              ' "$index_dir/series.json" > "$index_dir/series.json.new"
            else
              jq -n --argjson entry "$entry" \
                '{schemaVersion:1,series:[$entry]}' > "$index_dir/series.json.new"
            fi
            mv "$index_dir/series.json.new" "$index_dir/series.json"

            git -C .benchmark/pages config user.name "github-actions[bot]"
            git -C .benchmark/pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C .benchmark/pages add llgo/baseline/series.json
            if git -C .benchmark/pages diff --cached --quiet; then
              exit 0
            fi
            git -C .benchmark/pages commit -m "ci: index LLGo benchmark ${SERIES_KIND} ${SERIES_ID}"
            if git -C .benchmark/pages push origin HEAD:pages; then
              exit 0
            fi
            echo "series index push raced; retrying (${attempt}/5)" >&2
          done
          echo "failed to update benchmark series index after 5 attempts" >&2
          exit 1

      - name: Generate pull request benchmark comment
        if: steps.series.outputs.kind == 'pull'
        run: |
          go run ./benchmark/baseline \
            -mode report \
            -current-data ".benchmark/pages/llgo/baseline/${{ steps.series.outputs.relative }}/data.js" \
            -main-data ".benchmark/pages/llgo/baseline/main/data.js" \
            -report .benchmark/comment.md \
            -series-url "${{ steps.series.outputs.series_url }}" \
            -source-url "https://github.com/${GITHUB_REPOSITORY}/commit/${{ steps.series.outputs.sha }}" \
            -run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}" \
            -source-sha "${{ steps.series.outputs.sha }}"

      - name: Create or update pull request benchmark comment
        if: steps.series.outputs.kind == 'pull'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.series.outputs.id }}
          SOURCE_SHA: ${{ steps.series.outputs.sha }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          if [[ "$current_head" != "$SOURCE_SHA" ]]; then
            echo "skip stale benchmark comment for $SOURCE_SHA; pull request is at $current_head"
            exit 0
          fi

          marker='<!-- llgo-baseline-benchmark -->'
          list_comments() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
              | sort -n
          }
          mapfile -t comment_ids < <(list_comments)
          payload="$(jq -n --rawfile body .benchmark/comment.md '{body:$body}')"
          if [[ "${#comment_ids[@]}" -eq 0 ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input - <<< "$payload" >/dev/null
          fi

          mapfile -t comment_ids < <(list_comments)
          canonical="${comment_ids[0]}"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${canonical}" \
            --input - <<< "$payload" >/dev/null
          for duplicate in "${comment_ids[@]:1}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${duplicate}"
          done

      - name: Deploy benchmark Pages
        env:
          GH_TOKEN: ${{ env.BENCHMARKS_TOKEN }}
        run: |
          gh api --method POST "repos/${BENCHMARKS_REPOSITORY}/dispatches" \
            -f event_type=llgo-baseline-published \
            -F "client_payload[source_repository]=${GITHUB_REPOSITORY}" \
            -F "client_payload[source_run_id]=${{ github.event.workflow_run.id }}"
