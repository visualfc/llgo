name: Baseline benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: benchmark (${{ matrix.display }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            id: linux
            display: Linux
          - os: macos-latest
            id: macos
            display: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BENCHMARKS_REPOSITORY: >-
        ${{ vars.BENCHMARKS_REPOSITORY ||
            format('{0}/llgo-benchmark-data', github.repository_owner) }}
      GOMAXPROCS: "2"
      LLGO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 19

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build LLGo
        run: |
          set -euo pipefail
          mkdir -p .benchmark
          go build -p=1 -o .benchmark/llgo ./cmd/llgo

      - name: Measure programs
        run: |
          set -euo pipefail
          go run ./benchmark/baseline \
            -llgo "$GITHUB_WORKSPACE/.benchmark/llgo" \
            -out "$GITHUB_WORKSPACE/.benchmark/results"

      - name: Run selected Go benchmarks
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/.benchmark/results/go.txt"
          GOMAXPROCS=1 go test \
            -run '^$' \
            -bench '^(BenchmarkMergeCompilerFlags|BenchmarkMergeLinkerFlags|BenchmarkLookupPCRandom)$' \
            -benchtime=250ms \
            -count=1 \
            -cpu=1 \
            ./internal/clang ./internal/build/funcinfo \
            | tee "$results"

          GOMAXPROCS=1 "$GITHUB_WORKSPACE/.benchmark/llgo" test \
            -run '^$' \
            -bench '^(BenchmarkRuntimeGetG|Benchmark(Global|TLS|GLS)(Read|Write)|Benchmark(DirectCall|InterfaceCall|Defer|ChannelBuffered|ChannelHandoff))$' \
            -benchtime=250ms \
            -count=1 \
            ./test/llgoext \
            | tee -a "$results"

          # The current native backend creates one pthread per goroutine and
          # intentionally has a bounded lifecycle stress limit. Keep creation
          # monitoring deterministic instead of letting testing auto-calibrate
          # to millions of host threads.
          GOMAXPROCS=1 "$GITHUB_WORKSPACE/.benchmark/llgo" test \
            -run '^$' \
            -bench '^BenchmarkGoroutine$' \
            -benchtime=100x \
            -count=1 \
            ./test/llgoext \
            | tee -a "$results"

      - name: Validate benchmark artifact
        run: go run ./benchmark/baseline -mode validate -out .benchmark/results

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: llgo-baseline-benchmark-${{ matrix.id }}
          path: |
            .benchmark/results/size.json
            .benchmark/results/time.json
            .benchmark/results/go.txt
          if-no-files-found: error
          retention-days: 30

      - name: Download main benchmark history
        run: |
          set -euo pipefail
          history_js=".benchmark/main-data.js"
          history_json=".benchmark/main-data.json"
          history_url="https://raw.githubusercontent.com/${BENCHMARKS_REPOSITORY}/pages/llgo/baseline/main/data.js"
          http_status="$(
            curl --silent --show-error --location \
              --retry 3 --retry-all-errors \
              --output "$history_js" \
              --write-out '%{http_code}' \
              "$history_url"
          )"
          case "$http_status" in
            200)
              sed 's/^window\.BENCHMARK_DATA = //' "$history_js" | jq . > "$history_json"
              ;;
            404)
              printf '%s\n' '{"lastUpdate":0,"repoUrl":"","entries":{}}' > "$history_json"
              ;;
            *)
              echo "benchmark history download returned HTTP $http_status" >&2
              exit 1
              ;;
          esac

      # v1.22.1. PR and branch jobs only read the main history. A trusted
      # workflow_run publishes validated artifacts without exposing its token.
      - name: Compare program sizes with main
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: ${{ matrix.display }} program binary size
          tool: customSmallerIsBetter
          output-file-path: .benchmark/results/size.json
          external-data-json-path: .benchmark/main-data.json
          save-data-file: false
          summary-always: true
          alert-threshold: 105%
          fail-threshold: 110%
          fail-on-alert: true

      - name: Compare program timings with main
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: ${{ matrix.display }} program build and run time
          tool: customSmallerIsBetter
          output-file-path: .benchmark/results/time.json
          external-data-json-path: .benchmark/main-data.json
          save-data-file: false
          summary-always: true
          alert-threshold: 140%
          fail-threshold: 200%
          fail-on-alert: true

      - name: Compare core benchmarks with main
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: ${{ matrix.display }} compiler and core language
          tool: go
          output-file-path: .benchmark/results/go.txt
          external-data-json-path: .benchmark/main-data.json
          save-data-file: false
          summary-always: true
          alert-threshold: 140%
          fail-threshold: 200%
          fail-on-alert: true
