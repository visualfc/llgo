name: Windows native compiler

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-compiler:
    name: native PE/COFF (windows-amd64, LLVM 19, Go 1.26.7)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.26.7"

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 19

      - name: Test Windows compiler host
        shell: msys2 {0}
        run: |
          set -euo pipefail

          go version
          clang --version
          pkg-config --modversion llvm-19
          where.exe cl.exe
          where.exe lib.exe
          where.exe link.exe

          # Compile the released binding through its normal Windows build
          # path, without byollvm or global CGO flag overrides.
          go test -run '^$' -timeout=10m github.com/xgo-dev/llvm
          go test -count=1 -timeout=10m -covermode=atomic \
            -coverprofile=coverage-windows-host.txt \
            ./internal/goarch ./internal/xtool/llvm ./internal/meta

          # Repetition verifies that the native file lock actually excludes
          # concurrent cache publishers rather than merely compiling on
          # Windows. The rest of crosscompile enters the matrix with R2.
          go test -count=20 -timeout=10m -run 'Lock' -covermode=atomic \
            -coverprofile=coverage-windows-lock.txt \
            ./internal/crosscompile

          # These packages already compile and their test processes start on
          # Windows. Their platform/runtime-dependent cases are enabled by
          # the later proposal stages instead of being hidden by build tags.
          go test -run '^$' -timeout=10m \
            ./ssa ./internal/build

          # R2 exercises actual PE/COFF outputs without depending on the
          # Win32 runtime work staged for R4: an executable, a flat C archive,
          # a DLL/import library, and both directions of MSVC interoperability.
          LLGO_REQUIRE_MSVC=1 go test -count=1 -timeout=10m \
            -run '^(TestWindows(NativeArtifacts|ConsumesMSVCLibrary|LinkObjFilesExactOutput)|TestResolveBuildConfigDefaultsAndValidation|TestApplyBuildModeCompileFlags|TestCSharedLinkArgs|TestFullRpathArgs|TestCSharedExportArgs|TestIsArchiveInput|TestBuildOutFmtsBuildModes)$' \
            -covermode=atomic -coverprofile=coverage-windows-artifacts.txt \
            ./internal/build

          # Exercise the R4 compiler paths on their native host. These tests
          # verify Win32 dynamic imports and the process-exit edge in the
          # generated main module without requiring a completed stdlib port.
          go test -count=1 -timeout=10m \
            -run '^(TestLowerWindowsCgoImportPointer|TestCompilePackageModuleLowersWindowsCgoImportPointer|TestLowerWindowsCgoImportPointerErrors|TestSplitWindowsCgoImportAlias|TestGenMainModuleWindowsExitsAfterMain)$' \
            -covermode=atomic -coverprofile=coverage-windows-build-runtime.txt \
            ./internal/build

          go test -count=1 -timeout=10m \
            -run '^(TestNativeToolchain|TestNativeWindows|TestCOFFLTOLevel)$' \
            -covermode=atomic -coverprofile=coverage-windows-coff-flags.txt \
            ./internal/crosscompile

          go test -count=1 -timeout=10m \
            -run '^(TestWriteResponseFile|TestWriteWindowsResponseArg|TestWriteGNUResponseArg|TestResponseFileStyle|TestUseResponseFile|TestLongWindowsCommandUsesClangResponseFile)$' \
            -covermode=atomic -coverprofile=coverage-windows-response.txt \
            ./internal/clang

          go test -count=1 -timeout=10m \
            -run '^(TestWindowsODRDefinitionsUseCOMDAT|TestUnixODRDefinitionsDoNotGainCOMDAT)$' \
            -covermode=atomic -coverprofile=coverage-windows-comdat.txt \
            ./ssa

          # Run every setjmp/sigjmp unit path on Windows. In particular this
          # covers the 386 zero unwind-record count and the amd64/arm64 frame
          # operands that differ from the POSIX lowering.
          go test -count=1 -timeout=10m \
            -run '^(TestSetjmpLongjmpIRPaths|TestSigjmpUsesSetjmpOnExplicitTarget|TestWindowsSigjmpBufferAlignment|TestWindowsSetjmpABI)$' \
            -covermode=atomic -coverprofile=coverage-windows-ssa-eh.txt \
            ./ssa

          go test -count=1 -timeout=10m \
            -run '^(TestTargetArchAndNewTransformerArchSelection|TestMSVC.*)$' \
            -covermode=atomic -coverprofile=coverage-windows-cabi.txt \
            ./internal/cabi

          # R5 compiler and metadata paths are ordinary Go code even though
          # their output is exercised by the native LLGo smokes below. Keep
          # them in the Windows coverage upload as well as executing the
          # generated Windows IR fixtures.
          go test -count=1 -timeout=10m \
            -run '^(TestFuncInfoMetadataDoesNotPreserveFunctions|TestSetjmpLongjmpIRPaths|TestSigjmpUsesSetjmpOnExplicitTarget|TestWindowsSigjmpBufferAlignment|TestWindowsSetjmpABI|TestWindowsSetjmpRejectsUnsupportedArchitecture|TestNeedsFramePointer|TestSetjmpReturnsTwice|TestDeferInitBuilderInheritsDebugLocation)$' \
            -covermode=atomic -coverprofile=coverage-windows-execution-ssa.txt \
            ./ssa
          go test -count=1 -timeout=10m \
            -run '^(TestCompileRuntimeCallerPanicPCLineMetadata|TestCompileRuntimeCallerStorePanicPCLineMetadataIsWindowsOnly|TestCompileRuntimeCallerPCLineMetadataOnWindows|TestFuncInfoDisplayName|TestFuncInfoMetadataEmission|TestFuncInfoWrapperMetadataIsWindowsOnly|TestDirectiveFilename|TestDirectiveFilenameWindowsRootedSlash|TestPrecedingLineDirectiveFilename|TestParseLineDirectiveFilename|TestRuntimeSourceFilename|TestCompileRuntimeCallerFrameUsesGoNameForLinkname|TestErrBuiltin)$' \
            -covermode=atomic -coverprofile=coverage-windows-execution-cl.txt \
            ./cl
          go test -count=1 -timeout=10m \
            -run '^(TestFuncInfo.*|TestEncodePacksWrapperFlagWithoutGrowingRecord|TestCOFFFuncInfoEntrySiteIsAssociative|TestExternalFuncInfoTableKeepsPayloadOutOfIR|TestLowerWindowsCgoImportPointerErrors)$' \
            -covermode=atomic -coverprofile=coverage-windows-execution-build.txt \
            ./internal/build ./internal/build/funcinfo
          go test -count=1 -timeout=10m \
            -run '^TestBuilderWindowsDebuggerMarkerUsesComdat$' \
            -covermode=atomic -coverprofile=coverage-windows-execution-debug.txt \
            ./internal/debuginfo
          go test -count=1 -timeout=10m -run '^TestFromTestlibc$/^setjmp$' ./ssa
          go test -count=1 -timeout=10m -run '^TestFromTestgo$/^(cgopython|defer5)$' ./ssa
          go test -count=1 -timeout=10m -run '^TestFromTestlibgo$/^mapzero$' ./ssa

          (
            cd runtime
            go test -count=1 -timeout=10m \
              -covermode=atomic -coverprofile=../coverage-windows-ffi.txt \
              ./internal/ffi ./internal/clite/ffi ./internal/lib/reflect
            for arch in 386 arm64; do
              CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go test -c \
                -o "$RUNNER_TEMP/llgo-ffi-$arch.test.exe" ./internal/ffi
            done
          )

          ffi_include="$(pkg-config --variable=includedir libffi)"
          clang -target x86_64-pc-windows-msvc -I"$ffi_include" -c \
            runtime/internal/clite/ffi/_wrap/libffi.c \
            -o "$RUNNER_TEMP/llgo-libffi-amd64.obj"
          llvm-readobj --file-headers "$RUNNER_TEMP/llgo-libffi-amd64.obj"

      - name: Upload Windows coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-windows-host.txt,coverage-windows-lock.txt,coverage-windows-artifacts.txt,coverage-windows-build-runtime.txt,coverage-windows-coff-flags.txt,coverage-windows-response.txt,coverage-windows-comdat.txt,coverage-windows-ssa-eh.txt,coverage-windows-cabi.txt,coverage-windows-execution-ssa.txt,coverage-windows-execution-cl.txt,coverage-windows-execution-build.txt,coverage-windows-execution-debug.txt,coverage-windows-ffi.txt
          flags: windows-native

      - name: Build and run the native Windows runtime and FFI smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:LLGO_ROOT = (Get-Location).Path
          $env:LLGO_BUILD_CACHE = "off"

          go build -o llgo-windows-smoke.exe ./cmd/llgo
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          # Keep every Go-supported Windows architecture's raw SyscallN bridge
          # assembly-valid even before the full 386 native execution lane lands.
          $clangExe = (Get-Command clang.exe).Source
          $llvmNmExe = (Get-Command llvm-nm.exe).Source
          $syscallAsm = Join-Path $env:LLGO_ROOT `
            "runtime\internal\lib\runtime\_wrap\syscall_windows.S"
          foreach ($syscallTarget in @(
            @{ Triple = "i686-pc-windows-msvc"; Symbol = "_llgo_windows_syscall" },
            @{ Triple = "x86_64-pc-windows-msvc"; Symbol = "llgo_windows_syscall" },
            @{ Triple = "aarch64-pc-windows-msvc"; Symbol = "llgo_windows_syscall" }
          )) {
            $syscallObj = Join-Path $env:RUNNER_TEMP `
              ("syscall-{0}.obj" -f $syscallTarget.Triple)
            & $clangExe "--target=$($syscallTarget.Triple)" `
              -c $syscallAsm -o $syscallObj
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            $symbols = & $llvmNmExe --defined-only $syscallObj | Out-String
            if (-not $symbols.Contains($syscallTarget.Symbol)) {
              throw "$($syscallTarget.Triple) bridge is missing $($syscallTarget.Symbol)"
            }
          }

          Push-Location runtime
          # Run the core runtime smoke with BDWGC enabled. The fixture checks
          # allocation, an explicit collection, MemStats, and a finalizer.
          ..\llgo-windows-smoke.exe build `
            -o ..\windows-runtime-smoke.exe `
            .\_test\windowsruntime
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -eq 0) {
            ..\llgo-windows-smoke.exe build -tags=nogc `
              -o ..\windows-stdlib-smoke.exe `
              .\_test\windowsstdlib
            $buildExitCode = $LASTEXITCODE
          }
          if ($buildExitCode -eq 0) {
            ..\llgo-windows-smoke.exe build `
              -o ..\windows-ffi-smoke.exe `
              .\_test\windowsffi
            $buildExitCode = $LASTEXITCODE
          }
          if ($buildExitCode -eq 0) {
            # A program with no imports only links the core runtime. Keep this
            # separate from the richer smoke programs so runtime.exit cannot
            # accidentally be supplied by an optional standard-library shim.
            ..\llgo-windows-smoke.exe build `
              -o ..\windows-empty-smoke.exe `
              .\_test\windowsempty
            $buildExitCode = $LASTEXITCODE
          }
          if ($buildExitCode -eq 0) {
            # Recover a hardware-backed nil call without relying on the
            # optional public-runtime traceback layer.
            ..\llgo-windows-smoke.exe build `
              -o ..\windows-core-fault-smoke.exe `
              .\_test\windowscorefault
            $buildExitCode = $LASTEXITCODE
          }
          Pop-Location
          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }
          $readObjExe = (Get-Command llvm-readobj.exe).Source
          & .\.github\workflows\check_windows_imports.ps1 `
            -ReadObj $readObjExe `
            -Artifacts @(
              ".\windows-runtime-smoke.exe",
              ".\windows-stdlib-smoke.exe",
              ".\windows-ffi-smoke.exe",
              ".\windows-empty-smoke.exe",
              ".\windows-core-fault-smoke.exe"
            )
          .\windows-runtime-smoke.exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $env:LLGO_TEST_UNRECOVERED_FAULT = "1"
          # This process is expected to write a panic to stderr and fail.
          # Temporarily keep native stderr non-terminating so it can be
          # asserted below even in Windows PowerShell 5.
          $savedErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try {
            $faultOutput = .\windows-runtime-smoke.exe 2>&1 | Out-String
            $faultExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $savedErrorActionPreference
          }
          Remove-Item Env:LLGO_TEST_UNRECOVERED_FAULT
          Write-Host $faultOutput
          if ($faultExitCode -eq 0) {
            throw "unrecovered Windows fault exited successfully"
          }
          foreach ($expected in @(
            "runtime error: invalid memory address or nil pointer dereference",
            "main.windowsNilFault",
            "windowsruntime/main.go"
          )) {
            if (-not $faultOutput.Contains($expected)) {
              throw "unrecovered Windows fault output is missing '$expected'"
            }
          }
          if ($faultOutput.Contains("github.com/xgo-dev/llgo/runtime/internal/clite/tls.init")) {
            throw "unrecovered Windows fault traceback continued past runtime.goexit"
          }
          .\windows-stdlib-smoke.exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $env:LLGO_TEST_OS_EXIT = "1"
          .\windows-stdlib-smoke.exe
          $exitCode = $LASTEXITCODE
          Remove-Item Env:LLGO_TEST_OS_EXIT
          if ($exitCode -ne 23) {
            throw "os.Exit(23) returned exit code $exitCode"
          }

          .\windows-ffi-smoke.exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          .\windows-empty-smoke.exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          .\windows-core-fault-smoke.exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
