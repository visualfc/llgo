name: Windows native compiler

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-compiler:
    name: native PE/COFF (windows-amd64, LLVM 19, Go 1.26.7)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.26.7"

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 19

      - name: Test Windows compiler host
        shell: msys2 {0}
        run: |
          set -euo pipefail

          go version
          clang --version
          pkg-config --modversion llvm-19
          where.exe cl.exe
          where.exe lib.exe
          where.exe link.exe

          # Compile the released binding through its normal Windows build
          # path, without byollvm or global CGO flag overrides.
          go test -run '^$' -timeout=10m github.com/xgo-dev/llvm
          go test -count=1 -timeout=10m -covermode=atomic \
            -coverprofile=coverage-windows-host.txt \
            ./internal/goarch ./internal/xtool/llvm ./internal/meta

          # Repetition verifies that the native file lock actually excludes
          # concurrent cache publishers rather than merely compiling on
          # Windows. The rest of crosscompile enters the matrix with R2.
          go test -count=20 -timeout=10m -run 'Lock' -covermode=atomic \
            -coverprofile=coverage-windows-lock.txt \
            ./internal/crosscompile

          # These packages already compile and their test processes start on
          # Windows. Their platform/runtime-dependent cases are enabled by
          # the later proposal stages instead of being hidden by build tags.
          go test -run '^$' -timeout=10m \
            ./ssa ./internal/build

          # R2 exercises actual PE/COFF outputs without depending on the
          # Win32 runtime work staged for R4: an executable, a flat C archive,
          # a DLL/import library, and both directions of MSVC interoperability.
          LLGO_REQUIRE_MSVC=1 go test -count=1 -timeout=10m \
            -run '^(TestWindows(NativeArtifacts|ConsumesMSVCLibrary)|TestResolveBuildConfigDefaultsAndValidation|TestApplyBuildModeCompileFlags|TestCSharedLinkArgs|TestFullRpathArgs|TestCSharedExportArgs|TestIsArchiveInput|TestBuildOutFmtsBuildModes)$' \
            -covermode=atomic -coverprofile=coverage-windows-artifacts.txt \
            ./internal/build

          go test -count=1 -timeout=10m \
            -run '^(TestNativeToolchain|TestNativeWindows|TestCOFFLTOLevel)$' \
            -covermode=atomic -coverprofile=coverage-windows-coff-flags.txt \
            ./internal/crosscompile

          go test -count=1 -timeout=10m \
            -run '^(TestWriteResponseFile|TestWriteWindowsResponseArg|TestWriteGNUResponseArg|TestResponseFileStyle|TestUseResponseFile|TestLongWindowsCommandUsesClangResponseFile)$' \
            -covermode=atomic -coverprofile=coverage-windows-response.txt \
            ./internal/clang

          go test -count=1 -timeout=10m \
            -run '^(TestWindowsODRDefinitionsUseCOMDAT|TestUnixODRDefinitionsDoNotGainCOMDAT)$' \
            -covermode=atomic -coverprofile=coverage-windows-comdat.txt \
            ./ssa

          go test -count=1 -timeout=10m \
            -run '^(TestTargetArchAndNewTransformerArchSelection|TestMSVC.*)$' \
            -covermode=atomic -coverprofile=coverage-windows-cabi.txt \
            ./internal/cabi

          (
            cd runtime
            go test -count=1 -timeout=10m \
              -covermode=atomic -coverprofile=../coverage-windows-ffi.txt \
              ./internal/ffi ./internal/clite/ffi ./internal/lib/reflect
            for arch in 386 arm64; do
              CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go test -c \
                -o "$RUNNER_TEMP/llgo-ffi-$arch.test.exe" ./internal/ffi
            done
          )

          ffi_include="$(pkg-config --variable=includedir libffi)"
          clang -target x86_64-pc-windows-msvc -I"$ffi_include" -c \
            runtime/internal/clite/ffi/_wrap/libffi.c \
            -o "$RUNNER_TEMP/llgo-libffi-amd64.obj"
          llvm-readobj --file-headers "$RUNNER_TEMP/llgo-libffi-amd64.obj"

      - name: Upload Windows coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-windows-host.txt,coverage-windows-lock.txt,coverage-windows-artifacts.txt,coverage-windows-coff-flags.txt,coverage-windows-response.txt,coverage-windows-comdat.txt,coverage-windows-cabi.txt,coverage-windows-ffi.txt
          flags: windows-native
