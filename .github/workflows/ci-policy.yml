name: CI policy

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This independent check must never be gated by the policy it tests.
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install workflow test dependency
        run: python -m pip install -r .github/scripts/requirements-ci.txt
      - name: Test decisions and workflow contracts
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
