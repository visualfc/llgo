name: GOROOT

on:
  workflow_dispatch:
  schedule:
    # 02:00 Asia/Shanghai (18:00 UTC on the previous day).
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  goroot:
    name: GOROOT (${{ matrix.os }}${{ startsWith(matrix.os, 'windows') && format(', {0}, {1}', matrix.windows_abi, matrix.windows_arch) || '' }}, Go ${{ matrix.go-version }}, shard ${{ matrix.shard-index }}/4)
    timeout-minutes: 180
    env:
      GOPROXY: https://proxy.golang.org,direct
      LLGO_GOROOT_HEARTBEAT_SECONDS: "60"
      LLGO_GOROOT_VERBOSE: "1"
    strategy:
      fail-fast: false
      matrix:
        # GOROOT is the compiler's primary compatibility suite. Always cover
        # the two most recent Go releases; LLGo and this runner are still built
        # once per job with the current toolchain from .go-version.
        os: [macos-latest, ubuntu-latest, windows-2022, windows-11-arm]
        go-version: ["1.26", "1.27"]
        windows_abi: [msvc, mingw]
        windows_arch: [amd64, arm64, "386"]
        shard-index: ["0", "1", "2", "3"]
        exclude:
          - os: macos-latest
            windows_abi: mingw
          - os: ubuntu-latest
            windows_abi: mingw
          - os: macos-latest
            windows_arch: arm64
          - os: macos-latest
            windows_arch: "386"
          - os: ubuntu-latest
            windows_arch: arm64
          - os: ubuntu-latest
            windows_arch: "386"
          - os: windows-2022
            windows_arch: arm64
          - os: windows-11-arm
            windows_arch: amd64
          - os: windows-11-arm
            windows_arch: "386"
        include:
          - os: ubuntu-latest
            runner: [qiniu, ubuntu-24.04-large]
    runs-on: ${{ github.repository_owner == 'xgo-dev' && matrix.runner || matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Set up Go for building LLGo and the runner
        uses: ./.github/actions/setup-go
        with:
          architecture: ${{ matrix.os == 'windows-11-arm' && matrix.windows_abi == 'mingw' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}

      - name: Build LLGo and the GOROOT runner
        shell: bash
        run: |
          LLGO_BUILD_GOROOT_RUNNER=1 dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"

          echo "LLGO_BUILD_GO_VERSION=$(go env GOVERSION)" >> "$GITHUB_ENV"

          tool_suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then
            tool_suffix=.exe
          fi
          runner="$RUNNER_TEMP/llgo-bin/goroot-runner${tool_suffix}"
          llgo="$RUNNER_TEMP/llgo-bin/llgo${tool_suffix}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The shell launches the runner, while the Go runner launches
            # llgo through the native Windows process API.
            llgo="$(cygpath -w "$llgo")"
          fi
          echo "LLGO_GOROOT_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "LLGO_TEST_LLGO=$llgo" >> "$GITHUB_ENV"

      - name: Resolve target Go version
        id: target-go
        shell: bash
        env:
          GO_SERIES: ${{ matrix.go-version }}
        run: |
          source dev/go_toolchain.sh
          target_version="$(llgo_resolve_go_version "$GITHUB_WORKSPACE" "$GO_SERIES")"
          echo "version=$target_version" >> "$GITHUB_OUTPUT"

      # The toolchain module downloaded through GOTOOLCHAIN omits GOROOT/test.
      # Install the complete distribution after building LLGo and the runner,
      # so those binaries always use .go-version while the corpus can vary.
      - name: Set up target Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ steps.target-go.outputs.version }}
          architecture: ${{ matrix.os == 'windows-11-arm' && matrix.windows_abi == 'mingw' && 'arm64' || startsWith(matrix.os, 'windows') && 'x64' || '' }}

      - name: Select target GOROOT
        shell: bash
        run: |
          target_version="$(go env GOVERSION)"
          target_version="${target_version#go}"
          target_goroot="$(go env GOROOT)"
          if [[ ! -d "$target_goroot/test" ]]; then
            echo "Target Go distribution does not contain GOROOT/test: $target_goroot" >&2
            exit 1
          fi
          echo "LLGO_TARGET_GO_VERSION=$target_version" >> "$GITHUB_ENV"
          echo "LLGO_TARGET_GOROOT=$target_goroot" >> "$GITHUB_ENV"

      - name: Activate native Windows target
        if: runner.os == 'Windows'
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Show toolchain versions
        shell: bash
        run: |
          echo "LLGo build toolchain: $LLGO_BUILD_GO_VERSION"
          echo "Target GOROOT: $LLGO_TARGET_GOROOT"
          target_go="$LLGO_TARGET_GOROOT/bin/go"
          if [[ "$RUNNER_OS" == Windows ]]; then
            target_go+=.exe
          fi
          "$target_go" version
          go env GOPROXY GOMODCACHE
          clang --version

      - name: Run GOROOT runner
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          min_swap_free_mib=512
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # macOS manages swap dynamically; a low instantaneous free value
            # does not mean the runner cannot make forward progress.
            min_swap_free_mib=0
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Generated programs write into pipes and terminate through
            # ExitProcess, which does not run CRT stream teardown.
            export LLGO_STDIO_NOBUF=1
          fi
          set +e
          bash dev/test_goroot.sh "$LLGO_TARGET_GOROOT" -- \
            -directive-mode ci \
            -min-swap-free-mib "$min_swap_free_mib" \
            -progress 60s \
            -shard-index "${{ matrix.shard-index }}" \
            -shard-total "4" 2>&1 | tee "$RUNNER_TEMP/goroot.log"
          runner_status=${PIPESTATUS[0]}
          set -e
          exit "$runner_status"

      - name: Summarize GOROOT shard
        if: always()
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          WINDOWS_ABI: ${{ matrix.windows_abi }}
          WINDOWS_ARCH: ${{ matrix.windows_arch }}
          SHARD_INDEX: ${{ matrix.shard-index }}
        run: |
          GO_VERSION="$LLGO_TARGET_GO_VERSION"
          log="$RUNNER_TEMP/goroot.log"
          report_dir="$RUNNER_TEMP/goroot-report"
          mkdir -p "$report_dir"
          touch "$log"

          platform=linux/amd64
          if [[ "$MATRIX_OS" == "macos-latest" ]]; then
            platform=darwin/arm64
          elif [[ "$MATRIX_OS" == "windows-2022" ]]; then
            platform="windows-${WINDOWS_ABI}/${WINDOWS_ARCH}"
          elif [[ "$MATRIX_OS" == "windows-11-arm" ]]; then
            platform="windows-${WINDOWS_ABI}/${WINDOWS_ARCH}"
          fi

          selected=$(sed -nE 's/.* shard=[^ ]+ cases=([0-9]+) directive_mode=.*/\1/p' "$log" | tail -1)
          observed=$(grep -Ec -- '--- (PASS|FAIL|SKIP): TestGoRootRunCases/' "$log" || true)
          failed=$(grep -Ec -- '--- FAIL: TestGoRootRunCases/' "$log" || true)
          skipped=$(grep -Ec -- '--- SKIP: TestGoRootRunCases/' "$log" || true)
          passed=$((observed - failed - skipped))
          if [[ -z "$selected" ]]; then
            selected='?'
          fi

          report_id="${platform//\//-}-${GO_VERSION}-${SHARD_INDEX}"
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$platform" "$GO_VERSION" "$SHARD_INDEX" "$selected" \
            "$observed" "$passed" "$failed" "$skipped" \
            >"$report_dir/summary-$report_id.tsv"
          awk -F '\t' \
            -v platform="$platform" \
            -v version="$GO_VERSION" \
            -v shard="$SHARD_INDEX" '
              $1 == "GOROOT_CASE_RESULT" {
                printf "%s\t%s\t%s\t%s\t%s\t%s\n", platform, version, shard, $2, $3, $4
              }
            ' "$log" >"$report_dir/cases-$report_id.tsv"

          {
            echo "### GOROOT $platform · Go $GO_VERSION · shard $SHARD_INDEX/4"
            echo
            echo '| Selected | Observed | Passed | Failed | Skipped |'
            echo '|---:|---:|---:|---:|---:|'
            echo "| $selected | $observed | $passed | $failed | $skipped |"
            echo
            echo '_Passed means the runner classification succeeded; expected xfail/not-applicable failures and classified flakes are counted as Passed._'
            echo
            echo '**Failed case paths**'
            if [[ "$failed" -eq 0 ]]; then
              echo
              echo '- none'
            else
              # shellcheck disable=SC2016 # The backreference is expanded by sed.
              sed -nE 's|.*--- FAIL: TestGoRootRunCases/([^ ]+).*|- `\1`|p' "$log"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # These short-lived artifacts only transport structured shard data to
      # goroot-summary. The human-readable report lives in the job summary.
      - name: Upload GOROOT shard statistics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goroot-stat-${{ matrix.os }}-${{ matrix.windows_abi }}-${{ matrix.windows_arch }}-${{ matrix.go-version }}-${{ matrix.shard-index }}
          path: ${{ runner.temp }}/goroot-report
          if-no-files-found: error
          retention-days: 1

  goroot-summary:
    name: GOROOT summary
    if: always()
    needs: goroot
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04"]') || 'ubuntu-24.04' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go for the report generator
        uses: ./.github/actions/setup-go

      - name: Download shard statistics
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: goroot-stat-*
          path: reports
          merge-multiple: true

      - name: Publish GOROOT run summary
        id: report
        if: always()
        env:
          GOROOT_RESULT: ${{ needs.goroot.result }}
        run: |
          source dev/go_toolchain.sh
          summary_tsv="$RUNNER_TEMP/goroot-summary.tsv"
          cases_tsv="$RUNNER_TEMP/goroot-cases.tsv"
          report_md="$RUNNER_TEMP/goroot-report.md"
          : >"$summary_tsv"
          : >"$cases_tsv"
          if [[ -d reports ]]; then
            find reports -type f -name 'summary-*.tsv' -exec cat {} + >>"$summary_tsv"
            find reports -type f -name 'cases-*.tsv' -exec cat {} + >>"$cases_tsv"
          fi

          report_count=$(wc -l <"$summary_tsv" | tr -d ' ')
          go126="$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.26)"
          go127="$(llgo_resolve_go_version "$GITHUB_WORKSPACE" 1.27)"
          write_row() {
            local label=$1
            local platform=$2
            local version=$3
            local expected_shards=$4
            awk -F '\t' \
              -v label="$label" \
              -v platform="$platform" \
              -v version="$version" \
              -v expected="$expected_shards" '
                $1 == platform && $2 == version {
                  shards++
                  if ($4 ~ /^[0-9]+$/) {
                    selected += $4
                  } else {
                    selected_unknown = 1
                  }
                  observed += $5
                  passed += $6
                  failed += $7
                  skipped += $8
                }
                END {
                  selected_text = selected_unknown ? "?" : selected
                  printf "| %s | %d/%d | %s | %d | %d | %d | %d |\n", \
                    label, shards, expected, selected_text, observed, passed, failed, skipped
                }
              ' "$summary_tsv"
          }

          {
            echo '## GOROOT run summary'
            echo
            echo "Received $report_count/64 shard reports."
            echo
            echo '| Platform / toolchain | Shards | Selected | Observed | Passed | Failed | Skipped |'
            echo '|---|---:|---:|---:|---:|---:|---:|'
            for version in "$go126" "$go127"; do
              write_row "🍎 ARM64 · Go $version" darwin/arm64 "$version" 4
              write_row "🐧 AMD64 · Go $version" linux/amd64 "$version" 4
              write_row "🪟 MSVC AMD64 · Go $version" windows-msvc/amd64 "$version" 4
              write_row "🪟 MSVC ARM64 · Go $version" windows-msvc/arm64 "$version" 4
              write_row "🪟 MSVC 386 · Go $version" windows-msvc/386 "$version" 4
              write_row "🪟 GNU AMD64 · Go $version" windows-mingw/amd64 "$version" 4
              write_row "🪟 GNU ARM64 · Go $version" windows-mingw/arm64 "$version" 4
              write_row "🪟 GNU 386 · Go $version" windows-mingw/386 "$version" 4
            done
            echo
            echo '_Passed means the runner classification succeeded; expected failures, not-applicable skips, host skips, and classified flakes do not count as Failed._'
            echo
          } >"$report_md"

          go run ./test/goroot/report \
            -input "$cases_tsv" \
            -platforms darwin/arm64,linux/amd64,windows-msvc/amd64,windows-msvc/arm64,windows-msvc/386,windows-mingw/amd64,windows-mingw/arm64,windows-mingw/386 \
            -versions "$go126,$go127" \
            -run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >>"$report_md"
          cat "$report_md" >>"$GITHUB_STEP_SUMMARY"
          echo "GOROOT_REPORT=$report_md" >>"$GITHUB_ENV"
          echo "GOROOT_REPORT_COUNT=$report_count" >>"$GITHUB_ENV"

      - name: Replace the daily GOROOT report issue
        if: always() && steps.report.outcome == 'success' && github.event_name == 'schedule' && github.repository == 'xgo-dev/llgo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_date="$(TZ=Asia/Shanghai date +%F)"
          title="[GOROOT daily] $report_date"
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'in:title "[GOROOT daily]"' \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title | test("^\\[GOROOT daily\\] [0-9]{4}-[0-9]{2}-[0-9]{2}$")) | .number' |
            while IFS= read -r issue_number; do
              gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY"
            done
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body-file "$GOROOT_REPORT"

      - name: Verify GOROOT matrix result
        if: always()
        env:
          GOROOT_RESULT: ${{ needs.goroot.result }}
        run: |
          if [[ "$GOROOT_REPORT_COUNT" -ne 64 ]]; then
            echo "error: expected 64 shard reports, got $GOROOT_REPORT_COUNT" >&2
            exit 1
          fi
          if [[ "$GOROOT_RESULT" != success ]]; then
            echo "error: one or more GOROOT shards did not succeed" >&2
            exit 1
          fi
