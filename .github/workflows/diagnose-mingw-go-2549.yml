name: Diagnose PR 2549 Windows Go crash

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: reproduce (windows-2025, mingw and pure Go, amd64, LLVM 22, Go 1.27)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == 'cpunion/llgo' &&
       github.head_ref == 'codex/test-mingw-go-crash-2549-20260909')
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      LLGO_ROOT: ${{ github.workspace }}
      LLGO_STDIO_NOBUF: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Check the runner exception context before installing dependencies
        id: context
        shell: python {0}
        run: |
          import json
          import os
          import runpy
          import subprocess
          from pathlib import Path

          output = Path('diag-results').resolve()
          output.mkdir(exist_ok=True)
          host = subprocess.check_output(['pwsh', '-NoProfile', '-Command',
              'Get-CimInstance Win32_Processor | Select-Object Name, Architecture, NumberOfCores | ConvertTo-Json'], text=True)
          (output / 'processor.json').write_text(host, encoding='utf-8')
          print(host, flush=True)
          helper = runpy.run_path('dev/diagnose_mingw_go.py')
          context = helper['record_exception_context'](output)
          large = context['context_bytes'] > 8192
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'large={str(large).lower()}\n')
          if not large:
              summary = {'classification': 'small-context-host', 'context': context}
              (output / 'comparison.json').write_text(json.dumps(summary, indent=2))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
                  stream.write('Small XSTATE host: the AMD control was already verified.\n')
                  stream.write('Skipping toolchain installation while sampling for an affected host.\n')
      - uses: ./.github/actions/setup-deps
        if: steps.context.outputs.large == 'true'
        with:
          llvm-version: '22'
          windows-abi: mingw
      - uses: ./.github/actions/setup-go
        if: steps.context.outputs.large == 'true'
      - name: Prepare native crash capture
        if: steps.context.outputs.large == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'llgo-procdump.zip'
          $install = Join-Path $env:RUNNER_TEMP 'llgo-procdump'
          Invoke-WebRequest 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install -Force
          $procdump = Join-Path $install 'procdump64.exe'
          $signature = Get-AuthenticodeSignature -FilePath $procdump
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') {
            throw 'ProcDump does not have a valid Microsoft signature'
          }
          Add-Content -Encoding utf8 $env:GITHUB_ENV "LLGO_DIAG_PROCDUMP=$procdump"
      - name: Record runner and build the original test package
        if: steps.context.outputs.large == 'true'
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diag-results | Out-Null
          Get-CimInstance Win32_Processor | Select-Object Name, Architecture, NumberOfCores |
            Format-List | Out-File diag-results/host.txt
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber |
            Format-List | Out-File diag-results/host.txt -Append
          Get-Content diag-results/host.txt
          git rev-parse HEAD
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          clang --version
          go test -c -cover -covermode=atomic '-ldflags=-linkmode=external -extldflags=-lsynchronization' -o diag-results/go.test.exe ./test/go
          if ($LASTEXITCODE -ne 0) { throw 'Test binary build failed' }
      - name: Compare stock and enlarged exception stack reserve
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: python {0}
        run: |
          import runpy
          runpy.run_path('dev/diagnose_mingw_reserve.py', run_name='__main__')
      - name: Upload test logs and matching executable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-mingw-go-diagnostics
          path: diag-results/
          retention-days: 3
