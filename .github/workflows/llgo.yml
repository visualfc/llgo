# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: LLGo

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  llgo:
    name: llgo (${{ matrix.lane }}, ${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }}, LLVM ${{ matrix.llvm }}, Go ${{ matrix.go }})
    continue-on-error: ${{ matrix.lane == 'compatibility' }}
    timeout-minutes: 60
    strategy:
      matrix:
        # Compatibility results are tied to these exact patch releases.
        # Keep the supported Go 1.25 and 1.26 endpoints on macOS so user
        # projects exercise both runtime generations there. macOS Intel is
        # covered by the release artifact smoke test, avoiding a duplicate
        # 35-minute demo job.
        include:
          - os: ubuntu-latest
            llvm: 19
            go: "1.25.0"
            lane: compatibility
          - os: ubuntu-latest
            llvm: 19
            go: "1.26.7"
            lane: primary
          - os: macos-latest
            llvm: 19
            go: "1.25.0"
            lane: compatibility
          - os: macos-latest
            llvm: 19
            go: "1.26.7"
            lane: primary
          - os: windows-2022
            llvm: 19
            go: "1.26.7"
            lane: primary
            windows_abi: msvc
          - os: windows-2022
            llvm: 19
            go: "1.26.7"
            lane: primary
            windows_abi: mingw
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
      - name: Install embedded dependencies
        uses: ./.github/actions/setup-embed-deps
      - name: Setup demo dependencies
        uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}

      - name: Set up Go for build
        uses: ./.github/actions/setup-go
        with:
          # Build with the newest toolchain so this compiler can run against
          # the older Go versions used by the compatibility matrix.
          go-version: "1.27.0"

      - name: Install
        shell: bash
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}

      - name: Validate the native Windows toolchain profile
        if: ${{ matrix.os == 'windows-2022' && matrix.lane == 'primary' }}
        shell: pwsh
        run: .\.github\workflows\test_windows_toolchain_profile.ps1 -Profile "${{ matrix.windows_abi }}"

      - name: Test demo without RPATH (expect failure)
        if: runner.os != 'Windows'
        run: |
          echo "Testing demo without RPATH (should fail)..."
          export LLGO_FULL_RPATH=false
          pkg-config --libs cargs
          if (cd ./_demo/c/cargs && llgo run .); then
            echo "ERROR: cargs demo should have failed without RPATH!"
            exit 1
          else
            echo "✓ cargs demo correctly failed without RPATH"
          fi

      - name: Test static cargs without a runtime search path
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export LLGO_FULL_RPATH=false
          pkg-config --libs cargs
          (cd ./_demo/c/cargs && llgo run .)

      - name: Test demos
        run: bash .github/workflows/test_demo.sh

      - name: Test demos (embedded target)
        run: bash .github/workflows/test_demo.sh --embedded

      - name: Test C header generation
        shell: bash
        run: |
          echo "Testing C header generation in different build modes..."
          cd _demo/go/export
          chmod +x test.sh
          ./test.sh

      - name: Test export with different symbol names on embedded targets
        shell: bash
        run: |
          echo "Testing //export with different symbol names on embedded targets..."
          cd _demo/embed/export
          chmod +x verify_export.sh
          ./verify_export.sh

      - name: Test ESP serial smoke (build + emulator)
        shell: bash
        run: |
          echo "Testing ESP32/ESP32-C3 build + emulator smoke..."
          cd _demo/embed
          chmod +x test-esp-serial-startup.sh
          ./test-esp-serial-startup.sh

      - name: Test ESP32-C3 startup regression
        shell: bash
        run: |
          echo "Testing ESP32-C3 startup regressions..."
          python -m pip install esptool==5.1.0
          cd _demo/embed
          chmod +x test_esp32c3_startup.sh
          ./test_esp32c3_startup.sh

      - name: _xtool build tests
        run: |
          cd _xtool
          llgo build -v ./...

      - name: Show test result
        run: cat result.md

      - name: Install LLDB for integration tests
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.lane == 'primary' }}
        run: sudo apt-get install -y lldb-${{matrix.llvm}}

      - name: Install MinGW LLDB for integration tests
        if: ${{ matrix.os == 'windows-2022' && matrix.windows_abi == 'mingw' && matrix.lane == 'primary' }}
        shell: msys2 {0}
        env:
          MSYS2_LLDB_PACKAGE_VERSION: "19.1.7-1"
          MSYS2_PYTHON_PACKAGE_VERSION: "3.12.8-2"
        run: |
          set -euo pipefail
          repo=https://repo.msys2.org/mingw/clang64
          prefix=mingw-w64-clang-x86_64
          pacman_args=(--noconfirm -U)
          for dependency in cc-libs expat bzip2 mpdecimal ncurses openssl sqlite3 tcl tk tzdata; do
            pacman_args+=(--assume-installed "$prefix-$dependency")
          done
          pacman "${pacman_args[@]}" \
            "$repo/$prefix-python-$MSYS2_PYTHON_PACKAGE_VERSION-any.pkg.tar.zst" \
            "$repo/$prefix-lldb-$MSYS2_LLDB_PACKAGE_VERSION-any.pkg.tar.zst"

          lldb_path=/clang64/bin/lldb.exe
          "$lldb_path" --version
          echo "LLGO_LLDB=$(cygpath -m "$lldb_path")" >> "$GITHUB_ENV"

      - name: LLDB integration tests
        if: ${{ matrix.lane == 'primary' && matrix.os != 'windows-2022' }}
        run: |
          echo "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v

      - name: LLDB integration tests (MSVC)
        if: ${{ matrix.lane == 'primary' && matrix.windows_abi == 'msvc' }}
        shell: pwsh
        run: |
          # The upstream LLVM 19.1.3 Windows archive records the Python home
          # from its build runner. Point embedded Python at the compatible
          # current 3.12 installation selected by setup-python instead.
          $env:PYTHONHOME = Split-Path (Get-Command python.exe).Source
          Write-Host "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v

      - name: LLDB integration tests (MinGW)
        if: ${{ matrix.lane == 'primary' && matrix.windows_abi == 'mingw' }}
        shell: msys2 {0}
        run: |
          # Git Bash prepends its own MinGW runtime DLLs to PATH. Use the
          # CLANG64 shell so the debuggee loads its ABI-matching dependencies.
          echo "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v

      - name: DWARF standard tests
        if: ${{ startsWith(matrix.os, 'macos') && matrix.os != 'macos-15-intel' }}
        run: go test -timeout 15m ./internal/build -run '^TestStandardDWARF$' -count=1 -v

  test:
    name: test (${{ matrix.lane }}, ${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }}, LLVM ${{ matrix.llvm }}, Go ${{ matrix.go }}, shard ${{ matrix.shard }})
    continue-on-error: ${{ matrix.lane == 'compatibility' }}
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 60 || startsWith(matrix.os, 'macos') && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # In-command package parallelism lets Ubuntu use two shards while
          # retaining headroom for the serial std build-mode checks.
          - os: ubuntu-latest
            llvm: 19
            go: "1.25.0"
            shard: "0"
            lane: compatibility
          - os: ubuntu-latest
            llvm: 19
            go: "1.25.0"
            shard: "1"
            lane: compatibility
          - os: ubuntu-latest
            llvm: 19
            go: "1.26.7"
            shard: "0"
            lane: primary
          - os: ubuntu-latest
            llvm: 19
            go: "1.26.7"
            shard: "1"
            lane: primary
          - os: ubuntu-latest
            llvm: 19
            go: "1.27.0"
            shard: "0"
            lane: primary
          - os: ubuntu-latest
            llvm: 19
            go: "1.27.0"
            shard: "1"
            lane: primary
          # The full demo lane above exercises Go 1.25 user-project/runtime
          # compatibility on macOS. Use one parallel current-Go shard there.
          - os: macos-latest
            llvm: 19
            go: "1.26.7"
            shard: "0"
            lane: primary
          - os: macos-latest
            llvm: 19
            go: "1.27.0"
            shard: "0"
            lane: primary
          # Each Windows profile runs the complete package set with -p=2.
          - os: windows-2022
            llvm: 19
            go: "1.26.7"
            shard: "0"
            lane: primary
            windows_abi: msvc
          - os: windows-2022
            llvm: 19
            go: "1.26.7"
            shard: "0"
            lane: primary
            windows_abi: mingw
          - os: windows-2022
            llvm: 19
            go: "1.27.0"
            shard: "0"
            lane: primary
            windows_abi: msvc
          - os: windows-2022
            llvm: 19
            go: "1.27.0"
            shard: "0"
            lane: primary
            windows_abi: mingw
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
      - name: Install further optional dependencies for demos
        uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}

      - name: Set up Go for build and testing
        uses: ./.github/actions/setup-go
        with:
          # Build with the newest toolchain so the resulting llgo remains
          # runnable against older Go standard libraries in compatibility
          # jobs, while Go 1.27 is built and run with the same toolchain.
          go-version: "1.27.0"

      - name: Install
        shell: bash
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}

      - name: Check Windows native runtime and FFI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llgo = (Get-Command llgo.exe).Source
          .\.github\workflows\test_windows_runtime.ps1 `
            -LLGo $llgo `
            -Profile "${{ matrix.windows_abi }}"

      - name: run llgo test
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ startsWith(matrix.os, 'ubuntu') && '2' || '1' }}
          TEST_JOBS: ${{ startsWith(matrix.os, 'windows') && '2' || startsWith(matrix.os, 'macos') && '3' || '4' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == Windows ]]; then
            # test/go launches the compiler from native subprocesses. Keep an
            # absolute Windows spelling without splitting the package list.
            export LLGO_TEST_COMPILER="$(cygpath -w "$(command -v llgo)")"
            export LLGO_STDIO_NOBUF=1
          fi

          pkgs=()
          while IFS= read -r pkg; do
            pkgs+=("${pkg}")
          done < <(go list -tags=llgo ./test/... | sort)

          selected=()
          for i in "${!pkgs[@]}"; do
            if (( i % SHARD_TOTAL == SHARD_INDEX )); then
              selected+=("${pkgs[$i]}")
            fi
          done

          echo "Shard: ${SHARD_INDEX}/${SHARD_TOTAL}, selected: ${#selected[@]} package(s)"
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No packages in this shard."
            exit 0
          fi
          printf '  %s\n' "${selected[@]}"

          std_pkgs=()
          for pkg in "${selected[@]}"; do
            if [[ "${{ matrix.os }}" == ubuntu-latest && "${{ matrix.go }}" == 1.26.7 && "${pkg}" == */test/std/* ]]; then
              std_pkgs+=("${pkg}")
            fi
          done

          echo "==> llgo test -p=${TEST_JOBS} (${#selected[@]} packages)"
          SECONDS=0
          llgo test -p="${TEST_JOBS}" -timeout=20m -bench='^BenchmarkGo126' -benchtime=1x "${selected[@]}"
          echo "==> llgo test done (${SECONDS}s)"

          if [[ "${#std_pkgs[@]}" -ne 0 ]]; then
            dev/test_std_buildmodes.sh "${std_pkgs[@]}"
          fi

  hello:
    name: hello (${{ matrix.lane }}, ${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }}, LLVM ${{ matrix.llvm }}, Go ${{ matrix.go }})
    continue-on-error: ${{ matrix.lane == 'compatibility' }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            llvm: 19
            go: "1.25.0"
            lane: compatibility
          - os: ubuntu-latest
            llvm: 19
            go: "1.26.7"
            lane: primary
          # Keep the Go 1.26 user-module compatibility matrix on every native
          # host platform; release artifact smoke tests alone only cover go 1.26.
          - os: macos-latest
            llvm: 19
            go: "1.26.7"
            lane: primary
          - os: windows-2022
            llvm: 19
            go: "1.26.7"
            lane: primary
            windows_abi: msvc
          - os: windows-2022
            llvm: 19
            go: "1.26.7"
            lane: primary
            windows_abi: mingw
          - os: ubuntu-latest
            llvm: 19
            go: "1.27.0"
            lane: primary
          - os: macos-latest
            llvm: 19
            go: "1.27.0"
            lane: primary
          - os: windows-2022
            llvm: 19
            go: "1.27.0"
            lane: primary
            windows_abi: msvc
          - os: windows-2022
            llvm: 19
            go: "1.27.0"
            lane: primary
            windows_abi: mingw
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go
        with:
          # Build with the newest toolchain; compatibility jobs below run
          # this llgo binary against older Go standard libraries.
          go-version: "1.27.0"

      - name: Install llgo
        shell: bash
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}

      - name: Test Hello World with go.mod 1.21
        if: startsWith(matrix.go, '1.25') || startsWith(matrix.go, '1.26')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.21"

      - name: Test Hello World with go.mod 1.22
        if: startsWith(matrix.go, '1.25') || startsWith(matrix.go, '1.26')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.22"

      - name: Test Hello World with go.mod 1.24
        if: startsWith(matrix.go, '1.25') || startsWith(matrix.go, '1.26')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.24"

      - name: Test Hello World with go.mod 1.26
        if: startsWith(matrix.go, '1.26') || startsWith(matrix.go, '1.27')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.26"

      - name: Test Hello World with go.mod 1.27
        if: startsWith(matrix.go, '1.27')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.27"

  cross-compile:
    timeout-minutes: 30
    strategy:
      matrix:
        # WASI output is host-independent; keep this source build on Ubuntu.
        # Native Darwin coverage remains in the primary LLGo lanes and release
        # artifact smoke tests.
        os: [ubuntu-latest]
        llvm: [19]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install WAMR
        shell: bash
        run: bash dev/build_iwasm.sh

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Test Cross Compilation (wasm)
        shell: bash
        working-directory: _demo/c
        run: |
          echo "Testing cross-compilation wasm with $(go env GOVERSION)"

          # Compile for wasm architecture
          GOOS=wasip1 GOARCH=wasm llgo build -o hello.wasm -tags=nogc -v ./helloc

          # Check file type
          file hello.wasm

          iwasm --stack-size=819200000 --heap-size=800000000 hello.wasm

  wasm-runtime:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.0", "1.26.7", "1.27.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 19

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "4.0.21"

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go
        with:
          # Keep the compiler binary built with the newest toolchain while
          # testing it against each matrix Go standard library below.
          go-version: "1.27.0"

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}

      - name: Build standard runtime for wasm
        shell: bash
        run: |
          GOOS=js GOARCH=wasm llgo build -o "$RUNNER_TEMP/runtime-js.wasm" ./internal/build/testdata/wasm-runtime
          GOOS=wasip1 GOARCH=wasm llgo build -o "$RUNNER_TEMP/runtime-wasip1.wasm" ./internal/build/testdata/wasm-runtime
          file "$RUNNER_TEMP/runtime-js.wasm" "$RUNNER_TEMP/runtime-wasip1.wasm"
