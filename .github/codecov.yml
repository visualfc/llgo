ignore:
  - "benchmark"
  - "chore"
  - "cmd"
  - "cl/cltest"
  - "internal/llgen"
  - "internal/mockable"
  - "internal/packages"
  - "internal/typepatch"
  - "internal/github"
  - "internal/firmware"
  - "internal/flash"
  - "internal/monitor"
  - "xtool"

# test/ is measured only by LLGo. The host Go workflow filters those records
# before uploading; a global ignore would also discard the LLGo coverage.
flags:
  go-tests:
    carryforward: false
  llgo-tests:
    paths:
      - "test/"
    carryforward: false
