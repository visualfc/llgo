version: 1
id: llgo-wasm
title: LLGo WebAssembly build benchmarks
site-path: benchmark/wasm
include: "^BenchmarkWasmBuild/"
groups:
  wasm: "^WasmBuild/"
views:
  wasm:
    title: WebAssembly build measurements
    select:
      groups: "^wasm$"
      metrics: "^(module-bytes|glue-bytes|build-ns)$"
    table:
      rows: [benchmark]
      columns: [metric]
      missing: error
      empty: error
      dimensions:
        benchmark:
          title: Profile
          trim-prefix: BenchmarkWasmBuild/
      metrics:
        module-bytes:
          title: Wasm module
          format: bytes
        glue-bytes:
          title: JS glue
          format: bytes
        build-ns:
          title: Build
          format: duration-ns
