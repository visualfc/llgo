timeouts:
  - version: go1.26
    platform: darwin/arm64
    directive: run
    case: fixedbugs/issue79186.go
    timeout: 90s
    reason: the 51.2 million-operation RWMutex stress loop needs load-dependent runtime slack
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: fixedbugs/issue79186.go
    timeout: 90s
    reason: the 51.2 million-operation RWMutex stress loop needs load-dependent runtime slack
  - version: go1.26
    platform: windows/amd64
    directive: run
    case: fixedbugs/issue79186.go
    timeout: 90s
    reason: the 51.2 million-operation RWMutex stress loop needs load-dependent runtime slack
  - version: go1.26
    platform: windows/arm64
    directive: run
    case: fixedbugs/issue79186.go
    timeout: 90s
    reason: the 51.2 million-operation RWMutex stress loop needs load-dependent runtime slack
  - version: go1.26
    platform: darwin/arm64
    directive: run
    case: fixedbugs/issue19658.go
    timeout: 2m
    reason: the test launches 19 nested go run commands and needs load-dependent runtime slack
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: abi/uglyfib.go
    timeout: 1m
    reason: uglyfib runs close to the default timeout on loaded linux/amd64 runners
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: chanlinear.go
    timeout: 1m
    reason: go1.26 chanlinear needs extra runtime slack on loaded linux/amd64 runners
  - version: go1.26
    platform: darwin/arm64
    directive: runoutput
    case: rangegen.go
    timeout: 20m
    reason: rangegen runoutput compiles the generated stress test past 10m on darwin/arm64 CI
  - version: go1.24
    platform: linux/amd64
    directive: run
    case: nosplit.go
    timeout: 2m
    reason: nosplit run runs past the default timeout on linux/amd64
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: nosplit.go
    timeout: 2m
    reason: nosplit run runs past the default timeout on linux/amd64
flakes:
  - version: go1.26
    platform: darwin/arm64
    directive: run
    case: fixedbugs/issue79186.go
    reason: the RWMutex stress test passes when the host is idle but can exceed its timeout under sustained CPU contention
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: fixedbugs/issue79186.go
    reason: the RWMutex stress test passes when the host is idle but can exceed its timeout under sustained CPU contention
  - version: go1.26
    platform: darwin/arm64
    directive: run
    case: chanlinear.go
    reason: the timing-based linearity check can pass or report chanSelect as too slow on darwin/arm64
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: fixedbugs/issue13160.go
    reason: go1.26 goroot run can either pass or panic in GC_call_with_stack_base on linux/amd64
